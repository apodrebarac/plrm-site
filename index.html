<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLRM — Anamarija Ami Podrebarac</title>
  <meta name="description" content="Practice-led research in memory, displacement, and computational poetics. Anamarija Ami Podrebarac.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: default;
    }

    canvas.hovering { cursor: pointer; }

    .graph-hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      pointer-events: none;
      z-index: 10;
    }

    .site-nav { z-index: 20; }

    canvas { opacity: 0.35; }

    .under-construction {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      text-align: center;
      pointer-events: none;
      padding: 48px 56px;
      background: rgba(12, 12, 12, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(51, 255, 51, 0.12);
      min-width: min(480px, 90vw);
    }

    .uc-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .uc-title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 400;
      color: var(--text-bright, #f0ede4);
      line-height: 1.15;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .uc-sub {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(16px, 2vw, 20px);
      color: var(--text-muted);
      margin-bottom: 40px;
    }

    .uc-divider {
      width: 32px;
      height: 1px;
      background: var(--accent);
      margin: 0 auto 40px;
      opacity: 0.5;
    }

    .uc-contact {
      pointer-events: all;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .uc-email {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .uc-email:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .uc-socials {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .uc-social {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }

    .uc-social:hover { color: var(--accent); }
  </style>
</head>
<body>

<canvas id="graph"></canvas>

<div class="under-construction">
  <div class="uc-label">// under construction</div>
  <div class="uc-title">PLRM</div>
  <div class="uc-sub">Anamarija Ami Podrebarac</div>
  <div class="uc-divider"></div>
  <div class="uc-contact">
    <a class="uc-email" href="mailto:ami@amipodrebarac.com">ami@amipodrebarac.com</a>
    <div class="uc-socials">
      <a class="uc-social" href="https://www.linkedin.com/in/anamarijapodrebarac/" target="_blank" rel="noopener">LinkedIn</a>
      <a class="uc-social" href="https://www.instagram.com/apodrebarac" target="_blank" rel="noopener">Instagram</a>
      <a class="uc-social" href="https://github.com/apodrebarac" target="_blank" rel="noopener">GitHub</a>
      <a class="uc-social" href="https://arts-london.academia.edu/AnamarijaAmiPodrebarac" target="_blank" rel="noopener">Academia</a>
      <a class="uc-social" href="https://www.researchgate.net/profile/Anamarija-Podrebarac-2" target="_blank" rel="noopener">ResearchGate</a>
      <a class="uc-social" href="https://researchers.arts.ac.uk/2361-anamarija-podrebarac" target="_blank" rel="noopener">UAL</a>
    </div>
  </div>
</div>

<script>
(function () {

  const canvas = document.getElementById('graph');
  const ctx    = canvas.getContext('2d');

  const C = {
    bg:         '#0c0c0c',
    node:       '#e0ddd4',
    nodeDim:    '#2a2926',
    edge:       'rgba(224,221,212,0.1)',
    edgeHover:  'rgba(51,255,51,0.6)',
    accent:     '#33ff33',
    label:      '#e0ddd4',
    labelDim:   '#2a2926',
    labelHover: '#33ff33',
  };

  const nodes = [
    { label: "Stone Performance",                       short: "Stone Performance",     url: "works/stone-performance.html" },
    { label: "Milk Performance",                        short: "Milk Performance",      url: "works/milk-performance.html" },
    { label: "Hello F0x, Goodbye F0x",                 short: "Hello F0x",             url: "works/hello-fox.html" },
    { label: "Room Performance",                        short: "Room Performance",      url: "works/room-performance.html" },
    { label: "Guilt, Pain & Chained",                  short: "Guilt, Pain & Chained", url: "works/guilt-pain-chained.html" },
    { label: "Cleaning Performance",                    short: "Cleaning Performance",  url: "works/cleaning-performance.html" },
    { label: "Immigrant and a Tree",                    short: "Immigrant and a Tree",  url: "works/immigrant-and-a-tree.html" },
    { label: "I Wish You Did Die",                      short: "I Wish You Did Die",    url: "works/i-wish-you-did-die.html" },
    { label: "F0x / 0wl",                              short: "F0x / 0wl",             url: "works/fox-owl.html" },
    { label: "Barbed Wire EMG",                         short: "Barbed Wire EMG",       url: "works/barbed-wire-emg.html" },
    { label: "Algorithmic Return to Repressed Memory",  short: "Performance 12",        url: "works/performance-12.html" },
  ];

  const edges = [
    [0, 1],  // Stone → Milk
    [0, 3],  // Stone → Room
    [0, 7],  // Stone → I Wish You Did Die
    [1, 3],  // Milk → Room
    [1, 7],  // Milk → I Wish You Did Die
    [2, 8],  // Hello F0x → F0x/0wl
    [2, 10], // Hello F0x → Performance 12
    [3, 4],  // Room → Guilt/Chained
    [3, 7],  // Room → I Wish You Did Die
    [4, 5],  // Guilt/Chained → Cleaning
    [5, 7],  // Cleaning → I Wish You Did Die
    [6, 8],  // Immigrant/Tree → F0x/0wl
    [6, 9],  // Immigrant/Tree → Barbed Wire EMG
    [6, 10], // Immigrant/Tree → Performance 12
    [7, 8],  // I Wish You Did Die → F0x/0wl
    [8, 9],  // F0x/0wl → Barbed Wire EMG
    [8, 10], // F0x/0wl → Performance 12
    [9, 10], // Barbed Wire EMG → Performance 12
  ];

  const adjacency = nodes.map(() => []);
  edges.forEach(([a, b]) => { adjacency[a].push(b); adjacency[b].push(a); });

  // Each edge gets its own animated control point for bezier curves
  const edgeCtrl = edges.map(() => ({
    ox: (Math.random() - 0.5) * 120,
    oy: (Math.random() - 0.5) * 120,
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.6,
  }));

  let W, H, hoveredNode = -1, dragNode = -1, t = 0;
  const DPR = window.devicePixelRatio || 1;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', () => { resize(); place(); });

  function place() {
    const cx = W / 2, cy = H / 2;
    const r  = Math.min(W, H) * 0.28;
    nodes.forEach((n, i) => {
      const angle = (i / nodes.length) * Math.PI * 2 - Math.PI / 2;
      n.x  = cx + r * Math.cos(angle) + (Math.random() - 0.5) * r * 0.5;
      n.y  = cy + r * Math.sin(angle) + (Math.random() - 0.5) * r * 0.5;
      n.vx = (Math.random() - 0.5) * 0.8;
      n.vy = (Math.random() - 0.5) * 0.8;
    });
  }
  place();

  function simulate() {
    t++;
    const cx = W / 2, cy = H / 2;
    const rest = Math.min(W, H) * 0.20;

    nodes.forEach(n => { n.fx = 0; n.fy = 0; });

    // Repulsion — softer so nodes can overlap more freely
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d  = Math.sqrt(dx * dx + dy * dy) || 1;
        const f  = 1800 / (d * d);
        a.fx -= dx / d * f; a.fy -= dy / d * f;
        b.fx += dx / d * f; b.fy += dy / d * f;
      }
    }

    // Spring attraction along edges — looser
    edges.forEach(([ai, bi]) => {
      const a = nodes[ai], b = nodes[bi];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d  = Math.sqrt(dx * dx + dy * dy) || 1;
      const f  = 0.010 * (d - rest);
      a.fx += dx / d * f; a.fy += dy / d * f;
      b.fx -= dx / d * f; b.fy -= dy / d * f;
    });

    // Slow sine-wave drift per node for organic knotting
    nodes.forEach((n, i) => {
      n.fx += Math.sin(t * 0.008 + i * 1.3) * 0.18;
      n.fy += Math.cos(t * 0.011 + i * 0.9) * 0.18;
    });

    // Weak center gravity
    nodes.forEach(n => {
      n.fx += (cx - n.x) * 0.006;
      n.fy += (cy - n.y) * 0.006;
      // More drift — less damping = freer movement
      n.vx  = (n.vx + n.fx) * 0.92 + (Math.random() - 0.5) * 0.18;
      n.vy  = (n.vy + n.fy) * 0.92 + (Math.random() - 0.5) * 0.18;
      n.x  += n.vx;
      n.y  += n.vy;
      const pad = 80;
      if (n.x < pad)     { n.x = pad;     n.vx *= -0.3; }
      if (n.x > W - pad) { n.x = W - pad; n.vx *= -0.3; }
      if (n.y < 70)      { n.y = 70;      n.vy *= -0.3; }
      if (n.y > H - pad) { n.y = H - pad; n.vy *= -0.3; }
    });

    // Animate bezier control points — they drift independently
    edgeCtrl.forEach((c, i) => {
      c.vx += (Math.random() - 0.5) * 0.4 + Math.sin(t * 0.009 + i) * 0.15;
      c.vy += (Math.random() - 0.5) * 0.4 + Math.cos(t * 0.007 + i) * 0.15;
      c.vx *= 0.94;
      c.vy *= 0.94;
      c.ox += c.vx;
      c.oy += c.vy;
      // Keep control point offset from growing too wild
      const maxOff = Math.min(W, H) * 0.18;
      if (Math.abs(c.ox) > maxOff) c.vx *= -0.5;
      if (Math.abs(c.oy) > maxOff) c.vy *= -0.5;
    });
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    const h   = hoveredNode;
    const adj = h >= 0 ? new Set(adjacency[h]) : new Set();

    // Edges — curved bezier paths
    edges.forEach(([ai, bi], ei) => {
      const a = nodes[ai], b = nodes[bi];
      const c = edgeCtrl[ei];
      const active = h >= 0 && (ai === h || bi === h);

      // Control point is midpoint + animated offset
      const mx = (a.x + b.x) / 2 + c.ox;
      const my = (a.y + b.y) / 2 + c.oy;

      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(mx, my, b.x, b.y);
      ctx.strokeStyle = active ? C.edgeHover : C.edge;
      ctx.lineWidth   = active ? 1.5 : 0.8;
      ctx.stroke();
    });

    // Nodes + labels
    nodes.forEach((n, i) => {
      const isH   = i === h;
      const isAdj = adj.has(i);
      const isDim = h >= 0 && !isH && !isAdj;

      // Glow
      if (isH || isAdj) {
        const glowR = isH ? 20 : 12;
        const grd   = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, glowR);
        grd.addColorStop(0, isH ? 'rgba(51,255,51,0.3)' : 'rgba(51,255,51,0.1)');
        grd.addColorStop(1, 'rgba(51,255,51,0)');
        ctx.beginPath();
        ctx.arc(n.x, n.y, glowR, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
      }

      // Circle
      ctx.beginPath();
      ctx.arc(n.x, n.y, isH ? 7 : 4.5, 0, Math.PI * 2);
      ctx.fillStyle = isH ? C.accent : isDim ? C.nodeDim : C.node;
      ctx.fill();

      // Label
      const text  = n.short;
      const fsize = isH ? 15 : 11;
      ctx.font         = isH
        ? `italic ${fsize}px "EB Garamond", Georgia, serif`
        : `${fsize}px "DM Mono", monospace`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';

      const lx = n.x;
      const ly = n.y > H * 0.72 ? n.y - 24 : n.y + 24;

      if (isH) {
        const tw = ctx.measureText(text).width;
        ctx.fillStyle = 'rgba(12,12,12,0.9)';
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(lx - tw / 2 - 8, ly - 11, tw + 16, 22, 3);
        } else {
          ctx.rect(lx - tw / 2 - 8, ly - 11, tw + 16, 22);
        }
        ctx.fill();
      }

      ctx.fillStyle = isH ? C.labelHover : isDim ? C.labelDim : C.label;
      ctx.fillText(text, lx, ly);
    });
  }

  function loop() { simulate(); render(); requestAnimationFrame(loop); }
  loop();

  const HIT = 22;
  function hit(mx, my) {
    for (let i = 0; i < nodes.length; i++) {
      const dx = mx - nodes[i].x, dy = my - nodes[i].y;
      if (dx * dx + dy * dy < HIT * HIT) return i;
    }
    return -1;
  }

  let dragStart = null;

  canvas.addEventListener('mousedown', e => {
    const i = hit(e.clientX, e.clientY);
    if (i >= 0) {
      dragNode = i;
      dragStart = { x: e.clientX, y: e.clientY };
      nodes[i].vx = 0;
      nodes[i].vy = 0;
      canvas.classList.add('hovering');
    }
  });

  canvas.addEventListener('mousemove', e => {
    if (dragNode >= 0) {
      nodes[dragNode].x = e.clientX;
      nodes[dragNode].y = e.clientY;
      nodes[dragNode].vx = 0;
      nodes[dragNode].vy = 0;
      hoveredNode = dragNode;
    } else {
      hoveredNode = hit(e.clientX, e.clientY);
      canvas.classList.toggle('hovering', hoveredNode >= 0);
    }
  });

  canvas.addEventListener('mouseup', e => {
    if (dragNode >= 0 && dragStart) {
      const dx = e.clientX - dragStart.x;
      const dy = e.clientY - dragStart.y;
      const wasDrag = Math.sqrt(dx * dx + dy * dy) > 5;
      if (!wasDrag) window.location.href = nodes[dragNode].url;
    }
    dragNode = -1;
    dragStart = null;
  });

  canvas.addEventListener('mouseleave', () => {
    dragNode = -1;
    dragStart = null;
    hoveredNode = -1;
    canvas.classList.remove('hovering');
  });

  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    const i = hit(t.clientX, t.clientY);
    if (i >= 0) { hoveredNode = i; e.preventDefault(); }
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    if (hoveredNode >= 0) { window.location.href = nodes[hoveredNode].url; }
    hoveredNode = -1;
  });

})();
</script>

</body>
</html>
